# Lägg filen i ditt repo som: .github/workflows/hamta-konserter.yml
# Kör konserter.py en gång per dygn och sparar konserter.json i repot.

name: Hämta konserter

on:
  schedule:
    - cron: "17 4 * * *"   # varje dag kl 04:17 UTC (05:17 vintertid, 06:17 sommartid i Sverige)
  workflow_dispatch:        # gör att du kan köra den för hand under fliken Actions

permissions:
  contents: write           # behövs för att spara konserter.json i repot

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install requests beautifulsoup4

      - name: Kör skriptet
        env:
          TZ: Europe/Stockholm
        run: python konserter.py

      - name: Spara konserter.json om något ändrats
        run: |
          git config user.name "konsert-bot"
          git config user.email "konsert-bot@users.noreply.github.com"
          git add konserter.json
          if git diff --cached --quiet; then
            echo "Inga ändringar idag."
          else
            git commit -m "Uppdatera konserter $(date +%F)"
            git push
          fi
